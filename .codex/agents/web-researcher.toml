name = "web-researcher"
description = "Систематический интернет-ресёрч с структурированным выводом. Используй для делегации задач: найти данные, сравнить API, исследовать конкурентов, собрать цены, найти библиотеки. Все факты возвращаются с ссылками-источниками.\n"
