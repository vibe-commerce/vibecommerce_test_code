# name — дефолт шаблона; при форке переименуй под свой проект селлера.
[project]
name = "vibecommerce-seller-project"
version = "0.3.2"
requires-python = ">=3.11"
dependencies = [
    "pyyaml",
    "httpx",
    "python-dotenv",
    # Аналитика включённых FREE-модулей (01-07) — нужны для `make run`/скриптов
    "openpyxl",
    "pandas",
    "numpy",
    "matplotlib",
    "requests",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff", "ipykernel"]

[tool.ruff]
line-length = 120
# Контракт совместимости — Python 3.11+ (см. requires-python). Синтаксический
# скан всех модулей/скриптов проходит под feature_version=(3,11).
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# Методические/демо-скрипты модулей — учебный код, не продакшн (см. backlog/plans
# апгрейда). Стилевые правила остаются строгими для тулинга шаблона (scripts/,
# *_template.py, calc_*), но расслаблены для демонстрационных скриптов в _modules/.
"_modules/**" = ["F841", "E402", "E702"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "e2e: End-to-end tests (may require external services)",
    "slow: Slow tests (>30s)",
]
